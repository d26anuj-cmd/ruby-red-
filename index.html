<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CoinDCX INR Futures</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #14171c; --muted: #6b7280;
    --border: #e5e7eb; --up: #0f9d58; --down: #d93025; --accent: #3b5bdb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --card: #181b21; --text: #e8eaed; --muted: #9aa0a6;
      --border: #2a2e36; --up: #34c27a; --down: #f2685c; --accent: #7b93ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 2; background: var(--bg);
    padding: 12px 16px; border-bottom: 1px solid var(--border);
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  button {
    padding: 8px 12px; font-size: 14px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
  }
  button.on { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .tabs { display: flex; gap: 6px; }
  .tabs button { flex: 1; }
  .status { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .status.err { color: var(--down); }
  main { padding: 12px 16px 40px; max-width: 900px; margin: 0 auto; }
  .row {
    display: grid; grid-template-columns: 28px 1fr auto; gap: 2px 10px;
    align-items: center; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; cursor: pointer;
  }
  .star { background: none; border: 0; padding: 0; font-size: 20px; cursor: pointer; color: var(--muted); }
  .star.fav { color: #f5b400; }
  .sym { font-weight: 600; font-size: 15px; }
  .rank { display: inline-block; min-width: 30px; font-size: 12px; font-weight: 700; color: var(--muted); }
  .right { text-align: right; font-variant-numeric: tabular-nums; }
  .big { font-weight: 700; font-size: 16px; }
  .small { font-size: 12px; }
  .meta {
    grid-column: 2 / 4; font-size: 12px; color: var(--muted);
    display: flex; flex-wrap: wrap; gap: 2px 14px; font-variant-numeric: tabular-nums;
  }
  .up { color: var(--up); } .down { color: var(--down); }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  .chart-wrap {
    position: fixed; inset: 0; z-index: 10; background: var(--bg);
    display: none; flex-direction: column;
  }
  .chart-wrap.open { display: flex; }
  .chart-head {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    border-bottom: 1px solid var(--border);
  }
  .chart-head .t { flex: 1; min-width: 0; }
  .chart-head .t b { font-size: 17px; }
  .chart-head .t div { font-size: 13px; font-variant-numeric: tabular-nums; }
  .chart-tf { display: flex; gap: 6px; padding: 8px 16px; overflow-x: auto; }
  .chart-tf button { padding: 6px 12px; font-size: 13px; }
  #chart { flex: 1; min-height: 0; position: relative; }
  .chart-msg {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--muted); font-size: 14px; text-align: center; padding: 16px; pointer-events: none;
  }
</style>
</head>
<body>
<header>
  <h1>CoinDCX INR Futures</h1>
  <div class="tabs" id="tabs">
    <button type="button" data-view="day" class="on">📅 आज का बदलाव</button>
    <button type="button" data-view="movers">🔥 टॉप मूवर्स 24h</button>
  </div>
  <div id="status" class="status">लोड हो रहा है…</div>
</header>
<main id="list"></main>

<div class="chart-wrap" id="chartWrap" role="dialog" aria-modal="true">
  <div class="chart-head">
    <div class="t"><b id="cSym"></b><div id="cInfo"></div></div>
    <button type="button" id="cClose" aria-label="Close">✕ बंद करें</button>
  </div>
  <div class="chart-tf" id="cTf">
    <button type="button" data-res="1">1m</button>
    <button type="button" data-res="5">5m</button>
    <button type="button" data-res="15" class="on">15m</button>
    <button type="button" data-res="60">1h</button>
    <button type="button" data-res="1D">1D</button>
  </div>
  <div id="chart"><div class="chart-msg" id="cMsg"></div></div>
</div>

<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<script>
// CoinDCX public endpoints (no API key needed).
const URL_INSTRUMENTS = "https://api.coindcx.com/exchange/v1/derivatives/futures/data/active_instruments?margin_currency_short_name%5B%5D=INR";
const URL_RT = "https://public.coindcx.com/market_data/v3/current_prices/futures/rt";
const URL_CANDLES = "https://public.coindcx.com/market_data/candlesticks"; // pcode=f = futures
const REFRESH_MS = 5000;
const MOVERS_COUNT = 25;
const IST_OFFSET = 5.5 * 3600; // seconds

const $ = id => document.getElementById(id);
const state = {
  view: "day",
  pairs: null,        // Set of INR futures pairs
  data: {},           // sym -> ticker
  dayOpen: {},        // sym -> price at 00:00 IST today
  dayKey: null,       // which IST day dayOpen belongs to
  favs: loadFavs(),
};

function loadFavs() {
  try { return new Set(JSON.parse(localStorage.getItem("favs") || "[]")); }
  catch { return new Set(); }
}
function saveFavs() {
  try { localStorage.setItem("favs", JSON.stringify([...state.favs])); } catch {}
}

const num = v => (v === undefined || v === null || v === "" ? null : Number(v));
const prettySym = s => s.replace(/^B-/, "").replace("_", " / ");
function fmtPrice(n) {
  if (n == null || isNaN(n)) return "–";
  const d = n >= 1000 ? 2 : n >= 1 ? 4 : 6;
  return n.toLocaleString("en-IN", { maximumFractionDigits: d });
}
function fmtNum(n) {
  if (n == null || isNaN(n)) return "–";
  if (n >= 1e7) return (n / 1e7).toFixed(2) + " Cr";
  if (n >= 1e5) return (n / 1e5).toFixed(2) + " L";
  if (n >= 1e3) return (n / 1e3).toFixed(1) + "K";
  return n.toFixed(2);
}
const pct = n => n == null || isNaN(n) ? "–" : (n >= 0 ? "+" : "") + n.toFixed(2) + "%";
const dirCls = n => n == null ? "" : n >= 0 ? "up" : "down";
const toSec = t => Math.floor(Number(t) / (Number(t) > 1e12 ? 1000 : 1));

// Start of today in IST, as unix seconds.
function istDayStart() {
  const now = Math.floor(Date.now() / 1000);
  return Math.floor((now + IST_OFFSET) / 86400) * 86400 - IST_OFFSET;
}

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  if (!r.ok) throw new Error("HTTP " + r.status);
  return r.json();
}

async function loadPairs() {
  const list = await getJSON(URL_INSTRUMENTS);
  const arr = Array.isArray(list) ? list : (list.data || []);
  state.pairs = new Set(arr.map(x => typeof x === "string" ? x : x.pair).filter(Boolean));
}

async function loadTicker() {
  const json = await getJSON(URL_RT);
  const prices = json.prices || json;
  const data = {};
  for (const [sym, p] of Object.entries(prices)) {
    if (!p || typeof p !== "object") continue;
    if (!state.pairs.has(sym)) continue;
    data[sym] = {
      sym, last: num(p.ls), chg24: num(p.pc),
      high: num(p.h), low: num(p.l), vol: num(p.v),
    };
  }
  state.data = data;
}

// Fetch each pair's price at 00:00 IST (open of the first 15m candle of the day).
let dayOpenRunning = false;
async function loadDayOpens() {
  const start = istDayStart();
  if (state.dayKey !== start) { state.dayKey = start; state.dayOpen = {}; }
  if (dayOpenRunning) return;
  dayOpenRunning = true;
  try {
    const todo = Object.keys(state.data).filter(s => state.dayOpen[s] == null);
    if (!todo.length) return;
    const worker = async () => {
      while (todo.length) {
        const sym = todo.shift();
        try {
          const url = `${URL_CANDLES}?pair=${encodeURIComponent(sym)}&from=${start}&to=${start + 3600}&resolution=15&pcode=f`;
          const json = await getJSON(url);
          const rows = (json.data || [])
            .map(k => ({ t: toSec(k.time), o: Number(k.open) }))
            .filter(k => k.t >= start && !isNaN(k.o))
            .sort((a, b) => a.t - b.t);
          if (rows.length && state.dayKey === start) state.dayOpen[sym] = rows[0].o;
        } catch {}
      }
    };
    await Promise.all(Array.from({ length: 6 }, worker));
    render();
  } finally {
    dayOpenRunning = false;
  }
}

async function refresh() {
  const st = $("status");
  try {
    if (!state.pairs) await loadPairs();
    await loadTicker();
    st.className = "status";
    st.textContent = Object.keys(state.data).length + " INR पेयर्स · अपडेट: " +
      new Date().toLocaleTimeString("en-IN");
    render();
    if (chartState.sym) updateChartHeader();
    loadDayOpens();
  } catch (e) {
    st.className = "status err";
    st.textContent = "डेटा नहीं मिल पाया (" + e.message + "). थोड़ी देर में फिर कोशिश होगी।";
  }
}

function starBtn(sym) {
  const fav = state.favs.has(sym);
  return `<button class="star ${fav ? "fav" : ""}" data-star="${sym}" aria-label="favourite">${fav ? "★" : "☆"}</button>`;
}

// List 1: change since 00:00 IST, highest first. Starred coins stay on top.
function renderDay() {
  const rows = Object.values(state.data).map(r => {
    const o = state.dayOpen[r.sym];
    const dayChg = o && r.last != null ? (r.last - o) / o * 100 : null;
    return { ...r, open: o, dayChg, dayMove: o && r.last != null ? r.last - o : null };
  });
  rows.sort((a, b) =>
    (state.favs.has(b.sym) - state.favs.has(a.sym)) ||
    ((b.dayChg ?? -1e9) - (a.dayChg ?? -1e9)));
  return rows.map((r, i) => {
    const c = dirCls(r.dayChg);
    const mv = r.dayMove == null ? "" : (r.dayMove >= 0 ? "+" : "−") + fmtPrice(Math.abs(r.dayMove));
    return `<div class="row" data-sym="${r.sym}">
      ${starBtn(r.sym)}
      <div class="sym"><span class="rank">#${i + 1}</span>${prettySym(r.sym)}</div>
      <div class="right">
        <div class="big ${c}">${r.dayChg == null ? "…" : pct(r.dayChg)}</div>
        <div class="small ${c}">${mv}</div>
      </div>
      <div class="meta">
        <span>अभी: ${fmtPrice(r.last)}</span>
        <span>दिन की शुरुआत: ${fmtPrice(r.open)}</span>
      </div>
    </div>`;
  }).join("");
}

// List 2: biggest 24h swing (high vs low). Skips the lowest-volume 25% so thin coins don't show up.
function renderMovers() {
  const all = Object.values(state.data).filter(r => r.high && r.low && r.vol != null);
  const vols = all.map(r => r.vol).sort((a, b) => a - b);
  const minVol = vols.length ? vols[Math.floor(vols.length / 4)] : 0;
  const rows = all
    .filter(r => r.vol >= minVol)
    .map(r => ({ ...r, range: (r.high - r.low) / r.low * 100 }))
    .sort((a, b) => b.range - a.range)
    .slice(0, MOVERS_COUNT);
  return rows.map((r, i) => {
    const c = dirCls(r.chg24);
    return `<div class="row" data-sym="${r.sym}">
      ${starBtn(r.sym)}
      <div class="sym"><span class="rank">#${i + 1}</span>${prettySym(r.sym)}</div>
      <div class="right">
        <div class="big">${r.range.toFixed(2)}%</div>
        <div class="small">उतार-चढ़ाव</div>
      </div>
      <div class="meta">
        <span>अभी: ${fmtPrice(r.last)}</span>
        <span class="${c}">24h: ${pct(r.chg24)}</span>
        <span>H: ${fmtPrice(r.high)}</span>
        <span>L: ${fmtPrice(r.low)}</span>
        <span>Vol: ${fmtNum(r.vol)}</span>
      </div>
    </div>`;
  }).join("");
}

function render() {
  const html = state.view === "day" ? renderDay() : renderMovers();
  $("list").innerHTML = html || '<div class="empty">' +
    (state.pairs ? "कोई INR पेयर नहीं मिला" : "लोड हो रहा है…") + "</div>";
}

$("list").addEventListener("click", e => {
  const star = e.target.closest("[data-star]");
  if (star) {
    const s = star.dataset.star;
    state.favs.has(s) ? state.favs.delete(s) : state.favs.add(s);
    saveFavs();
    render();
    return;
  }
  const row = e.target.closest(".row");
  if (row) openChart(row.dataset.sym);
});
$("tabs").addEventListener("click", e => {
  const b = e.target.closest("button[data-view]");
  if (!b) return;
  state.view = b.dataset.view;
  for (const x of $("tabs").children) x.classList.toggle("on", x === b);
  render();
});

// ---------- Chart ----------
const RES_SECONDS = { "1": 60, "5": 300, "15": 900, "60": 3600, "1D": 86400 };
const chartState = { sym: null, res: "15", chart: null, candles: null, vol: null, timer: null };

function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }

function ensureChart() {
  if (chartState.chart) return true;
  if (!window.LightweightCharts) {
    $("cMsg").textContent = "चार्ट लाइब्रेरी लोड नहीं हुई। इंटरनेट जाँचें।";
    return false;
  }
  const c = LightweightCharts.createChart($("chart"), {
    autoSize: true,
    layout: { background: { color: cssVar("--bg") }, textColor: cssVar("--muted") },
    grid: { vertLines: { color: cssVar("--border") }, horzLines: { color: cssVar("--border") } },
    timeScale: { timeVisible: true, secondsVisible: false, borderColor: cssVar("--border") },
    rightPriceScale: { borderColor: cssVar("--border") },
    localization: { timeFormatter: t => new Date(t * 1000).toLocaleString("en-IN") },
  });
  const up = cssVar("--up"), down = cssVar("--down");
  chartState.candles = c.addCandlestickSeries({
    upColor: up, downColor: down, borderUpColor: up, borderDownColor: down,
    wickUpColor: up, wickDownColor: down,
  });
  chartState.vol = c.addHistogramSeries({ priceFormat: { type: "volume" }, priceScaleId: "vol" });
  c.priceScale("vol").applyOptions({ scaleMargins: { top: 0.8, bottom: 0 } });
  chartState.chart = c;
  return true;
}

async function loadCandles(fit) {
  const { sym, res } = chartState;
  if (!sym || !ensureChart()) return;
  const to = Math.floor(Date.now() / 1000);
  const from = to - RES_SECONDS[res] * 300;
  try {
    const json = await getJSON(`${URL_CANDLES}?pair=${encodeURIComponent(sym)}&from=${from}&to=${to}&resolution=${res}&pcode=f`);
    if (sym !== chartState.sym || res !== chartState.res) return; // user switched meanwhile
    const rows = (json.data || []).map(k => ({
      time: toSec(k.time), open: +k.open, high: +k.high, low: +k.low, close: +k.close, volume: +k.volume,
    })).filter(k => k.time && !isNaN(k.close)).sort((a, b) => a.time - b.time);
    const uniq = rows.filter((k, i) => i === 0 || k.time !== rows[i - 1].time);
    if (!uniq.length) { $("cMsg").textContent = "इस कॉइन का चार्ट डेटा नहीं मिला।"; return; }
    $("cMsg").textContent = "";
    const up = cssVar("--up"), down = cssVar("--down");
    chartState.candles.setData(uniq);
    chartState.vol.setData(uniq.map(k => ({
      time: k.time, value: k.volume, color: (k.close >= k.open ? up : down) + "66",
    })));
    if (fit) chartState.chart.timeScale().fitContent();
  } catch (e) {
    $("cMsg").textContent = "चार्ट लोड नहीं हुआ (" + e.message + ").";
  }
}

function updateChartHeader() {
  const d = state.data[chartState.sym];
  if (!d) return;
  const o = state.dayOpen[d.sym];
  const dc = o && d.last != null ? (d.last - o) / o * 100 : null;
  $("cInfo").innerHTML = `${fmtPrice(d.last)} · <span class="${dirCls(dc)}">आज: ${pct(dc)}</span>`;
}

function openChart(sym) {
  chartState.sym = sym;
  $("cSym").textContent = prettySym(sym);
  updateChartHeader();
  $("chartWrap").classList.add("open");
  $("cMsg").textContent = "चार्ट लोड हो रहा है…";
  if (chartState.candles) { chartState.candles.setData([]); chartState.vol.setData([]); }
  loadCandles(true);
  clearInterval(chartState.timer);
  chartState.timer = setInterval(() => loadCandles(false), 10000);
}

function closeChart() {
  $("chartWrap").classList.remove("open");
  clearInterval(chartState.timer);
  chartState.sym = null;
}

$("cClose").addEventListener("click", closeChart);
document.addEventListener("keydown", e => { if (e.key === "Escape") closeChart(); });
$("cTf").addEventListener("click", e => {
  const b = e.target.closest("button[data-res]");
  if (!b) return;
  chartState.res = b.dataset.res;
  for (const x of $("cTf").children) x.classList.toggle("on", x === b);
  $("cMsg").textContent = "चार्ट लोड हो रहा है…";
  loadCandles(true);
});

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
