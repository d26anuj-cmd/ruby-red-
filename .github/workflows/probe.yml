name: probe-coindcx
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          O="Origin: https://d26anuj-cmd.github.io"
          probe() {
            echo "=================== $1"
            curl -sS -m 30 -H "$O" -D /tmp/h -o /tmp/b "$1" || true
            grep -iE "^HTTP|access-control-allow-origin|content-type" /tmp/h || true
            echo "--- bytes: $(wc -c < /tmp/b)"
            head -c 400 /tmp/b; echo
          }
          RT="https://public.coindcx.com/market_data/v3/current_prices/futures/rt"
          ENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$RT")
          probe "https://corsproxy.io/?url=$ENC"
          probe "https://api.allorigins.win/raw?url=$ENC"
          probe "https://api.codetabs.com/v1/proxy?quest=$RT"
          NOW=$(date +%s); FROM=$((NOW-3600))
          C="https://public.coindcx.com/market_data/candlesticks?pair=B-BTC_USDT&from=$FROM&to=$NOW&resolution=15&pcode=f"
          CENC=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$C")
          probe "https://corsproxy.io/?url=$CENC"
          probe "https://api.allorigins.win/raw?url=$CENC"
          echo "=== USDTINR"
          curl -sS -m 30 https://api.coindcx.com/exchange/ticker | python3 -c "import json,sys;d=json.load(sys.stdin);print([x for x in d if x.get('market') in ('USDTINR','BTCINR')])" || true
          probe "https://api.coindcx.com/api/v1/derivatives/futures/data/conversions"
          probe "https://api.coindcx.com/exchange/v1/derivatives/futures/data/instrument?pair=B-BTC_USDT&margin_currency_short_name=INR"
