name: probe-coindcx
on:
  push:
    paths: [".github/workflows/probe.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe endpoints
        run: |
          O="Origin: https://d26anuj-cmd.github.io"
          probe() {
            echo "=================== $1"
            curl -sS -m 30 -H "$O" -D /tmp/h -o /tmp/b "$1" || true
            grep -iE "^HTTP|access-control|content-type" /tmp/h || true
            echo "--- bytes: $(wc -c < /tmp/b)"
            head -c 1500 /tmp/b; echo
          }
          probe "https://api.coindcx.com/exchange/v1/derivatives/futures/data/active_instruments?margin_currency_short_name%5B%5D=INR"
          probe "https://api.coindcx.com/exchange/v1/derivatives/futures/data/active_instruments?margin_currency_short_name%5B%5D=USDT"
          probe "https://public.coindcx.com/market_data/v3/current_prices/futures/rt"
          echo "=== rt keys sample"; python3 -c "import json;d=json.load(open('/tmp/b'));p=d.get('prices',d);k=list(p);print(len(k));print([x for x in k if 'INR' in x][:30]);print(k[:20]);print(json.dumps(p[k[0]]))" || true
          NOW=$(date +%s); FROM=$((NOW-3600))
          probe "https://public.coindcx.com/market_data/candlesticks?pair=B-BTC_USDT&from=$FROM&to=$NOW&resolution=15&pcode=f"
          probe "https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js" | head -8
